Timeout 3700
KeepAliveTimeout 30
Alias /Microsoft-Server-ActiveSync /usr/share/z-push/index.php
<Directory /usr/share/z-push>
    DirectoryIndex index.php
    Options -Indexes +FollowSymLinks
    AllowOverride none
    Require all granted
    <Files "config.php">
        Require all denied
    </Files>
</Directory>
